<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>veccin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/font/minecraft-font.woff2') format('woff2');
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 4.5rem;
            margin-bottom: 3rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #e73c7e, 0 0 30px #23a6d5;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px #e73c7e, 0 0 30px #23a6d5; }
            to { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 30px #e73c7e, 0 0 40px #23a6d5; }
        }

        .link-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-decoration: none;
            color: white;
            padding: 15px 30px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 320px;
            justify-content: center;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .yt-image {
            height: 35px;
            width: auto;
            margin-right: 15px;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.6));
        }

        .youtube-icon {
            color: #FF0000;
            font-size: 2.5rem;
            margin-right: 15px;
        }

        .subscribers {
            font-weight: bold;
        }

        .plancke-icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
        }

        .mc-font {
            font-family: 'Minecraft', monospace;
            color: #FF5555;
            text-shadow: 2px 2px 0px #3F1515;
            font-size: 1.5rem;
        }
        .mc-font2 {
            font-family: 'Minecraft', monospace;
            color: #FFFFFF;
            text-shadow: 2px 2px 0px #4b4b4b;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>!</h1>
    
    <a href="https://www.youtube.com/c/U" target="_blank" class="link-item">
        <img src="yt.png" alt="YouTube" class="yt-image">
        <span class="mc-font2">90k subscribers</span>
    </a>

    <a href="https://plancke.io/hypixel/player/stats/veccin" target="_blank" class="link-item">
        <img src="https://plancke.io/favicon.ico" alt="Plancke 아이콘" class="plancke-icon">
        <span class="mc-font">[</span><span class="mc-font2">YT</span><span class="mc-font">] veccin</span>
    </a>

</body>
</html>
